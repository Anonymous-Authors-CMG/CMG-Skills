# Build, test and release the VS Code extension in vscode/.
#
# - Every push / PR touching vscode/: compile and run the unit tests.
# - A tag like `vscode-v1.2.3`: test, package, attach the .vsix to a GitHub
#   Release, then publish to the VS Code Marketplace (if the VSCE_PAT secret is
#   set) and to Open VSX (if OVSX_PAT is set). Missing secrets skip that store.
name: vscode-extension

on:
  push:
    branches: [main]
    paths: [vscode/**, .github/workflows/vscode-extension.yml]
    tags: ['vscode-v*']
  pull_request:
    paths: [vscode/**]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: vscode

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: vscode/*.vsix }

  release:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: vsix, path: vscode/dist }
      - name: Check the tag matches package.json
        run: |
          want="vscode-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --title "VS Code extension ${GITHUB_REF_NAME#vscode-v}" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
      - name: VS Code Marketplace
        env: { VSCE_PAT: '${{ secrets.VSCE_PAT }}' }
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT not set; skipped the VS Code Marketplace"; exit 0; fi
          npx --yes @vscode/vsce@3 publish --packagePath dist/*.vsix
      - name: Open VSX (Cursor, Windsurf, VSCodium, …)
        env: { OVSX_PAT: '${{ secrets.OVSX_PAT }}' }
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT not set; skipped Open VSX"; exit 0; fi
          npx --yes ovsx@0 publish dist/*.vsix
