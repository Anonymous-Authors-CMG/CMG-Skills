# Copy to .github/workflows/issue-commit.yml in your repository.
# Add two repository secrets: CMG_API_KEY and CMG_MODEL
# (and CMG_BASE_URL if you are not using OpenAI).
name: Issue Commit

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: issue-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: Anonymous-Authors-CMG/CMG-Skills@v1
        with:
          api-key: ${{ secrets.CMG_API_KEY }}
          base-url: ${{ secrets.CMG_BASE_URL || 'https://api.openai.com/v1' }}
          model: ${{ secrets.CMG_MODEL }}
